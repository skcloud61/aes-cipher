<!DOCTYPE html>
<html lang="ko">
<head>
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AES Cipher">
    <meta name="theme-color" content="#5b21b6">
    <title>AES Cipher</title>
    <style>
        :root {
            --primary: #7c3aed;
            --primary-light: #a78bfa;
            --primary-dark: #4c1d95;
            --secondary: #4f46e5;
            --accent: #06b6d4;
            --success: #10b981;
            --danger: #ef4444;

            --bg: #f6f4ff;
            --surface: #ffffff;
            --surface-2: #faf9ff;
            --text: #1e1b4b;
            --text-sub: #6b7280;
            --border: #e8e5f5;
            --glass: rgba(255, 255, 255, 0.78);

            --shadow: 0 1px 2px rgba(76, 29, 149, 0.04), 0 8px 28px rgba(124, 58, 237, 0.10);
            --shadow-btn: 0 8px 24px rgba(124, 58, 237, 0.35);
            --radius: 20px;
            --radius-sm: 14px;
            --ease: cubic-bezier(0.22, 1, 0.36, 1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0e0c1d;
                --surface: #19162f;
                --surface-2: #211d3f;
                --text: #ede9fe;
                --text-sub: #9a97c0;
                --border: #2d2956;
                --glass: rgba(25, 22, 47, 0.78);
                --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 28px rgba(0, 0, 0, 0.35);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body { min-height: 100%; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Apple SD Gothic Neo',
                         'Pretendard', 'Noto Sans KR', 'Helvetica Neue', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ───── 아이콘 ───── */
        .ic {
            width: 1.15em;
            height: 1.15em;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        /* ───── 헤더 ───── */
        .app-header {
            position: relative;
            overflow: hidden;
            padding: calc(48px + env(safe-area-inset-top)) 20px 64px;
            text-align: center;
            color: #fff;
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 55%, var(--secondary) 100%);
        }
        .app-header .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.55;
            animation: float 9s ease-in-out infinite;
        }
        .blob.b1 { width: 200px; height: 200px; top: -70px; right: -50px; background: #a78bfa; }
        .blob.b2 { width: 180px; height: 180px; bottom: -80px; left: -50px; background: var(--accent); animation-delay: -4s; }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50%      { transform: translate(14px, 18px) scale(1.08); }
        }
        .header-inner { position: relative; z-index: 1; }
        .header-icon {
            width: 64px; height: 64px;
            margin: 0 auto 14px;
            display: grid; place-items: center;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
            font-size: 30px;
        }
        .header-title { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
        .header-sub { font-size: 12px; color: rgba(255, 255, 255, 0.75); margin-top: 4px; letter-spacing: 1.5px; }
        .header-badge {
            display: inline-flex; align-items: center; gap: 6px;
            margin-top: 12px;
            background: rgba(255, 255, 255, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 11px; font-weight: 700; letter-spacing: 1px;
        }

        /* ───── 탭 바 (세그먼트) ───── */
        .tab-wrap {
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 10px 16px;
            margin-top: -28px;
            pointer-events: none;
        }
        .tab-bar {
            position: relative;
            display: flex;
            max-width: 568px;
            margin: 0 auto;
            padding: 5px;
            background: var(--glass);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: var(--shadow);
            pointer-events: auto;
        }
        .tab-indicator {
            position: absolute;
            top: 5px; bottom: 5px; left: 5px;
            width: calc(50% - 5px);
            border-radius: 13px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            box-shadow: 0 4px 14px rgba(124, 58, 237, 0.4);
            transition: transform 0.35s var(--ease);
        }
        .tab-bar[data-active="decrypt"] .tab-indicator { transform: translateX(100%); }
        .tab-btn {
            position: relative; z-index: 1;
            flex: 1;
            padding: 12px 8px;
            border: none; background: none;
            font-size: 14px; font-weight: 700; font-family: inherit;
            color: var(--text-sub);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 6px;
            transition: color 0.25s;
        }
        .tab-btn.active { color: #fff; }

        /* ───── 컨텐츠 ───── */
        .tab-content {
            display: none;
            padding: 12px 16px calc(40px + env(safe-area-inset-bottom));
            max-width: 600px;
            margin: 0 auto;
        }
        .tab-content.active { display: block; animation: fadeInUp 0.4s var(--ease); }

        .card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        .card-title {
            display: flex; align-items: center; gap: 10px;
            font-size: 15px; font-weight: 700;
            margin-bottom: 16px;
        }
        .card-title .icon-badge {
            width: 32px; height: 32px;
            display: grid; place-items: center;
            border-radius: 10px;
            color: #fff; font-size: 16px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
        }
        .card-title .badge {
            margin-left: auto;
            font-size: 10px; font-weight: 700; letter-spacing: 0.5px;
            color: var(--primary-light);
            background: rgba(124, 58, 237, 0.12);
            border-radius: 8px; padding: 3px 8px;
        }

        .input-group { margin-bottom: 14px; }
        .input-label {
            display: block;
            font-size: 12px; font-weight: 600;
            color: var(--text-sub);
            margin-bottom: 8px;
        }
        .input-field {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 16px; font-family: inherit;
            background: var(--surface-2);
            color: var(--text);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
            -webkit-appearance: none;
        }
        .input-field::placeholder { color: var(--text-sub); opacity: 0.6; }
        .input-field:focus {
            border-color: var(--primary-light);
            background: var(--surface);
            box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.14);
        }
        .input-field.key-field {
            font-size: 17px; font-weight: 600;
            letter-spacing: 2px; text-align: center;
            color: var(--primary);
        }
        .input-field.key-field::placeholder { letter-spacing: 0; font-weight: 500; }
        .pw-wrapper { position: relative; }
        .pw-wrapper .input-field { padding-left: 48px; padding-right: 48px; }
        .pw-toggle {
            position: absolute; right: 8px; top: 50%;
            transform: translateY(-50%);
            width: 38px; height: 38px;
            display: grid; place-items: center;
            background: none; border: none; border-radius: 10px;
            cursor: pointer; color: var(--text-sub); font-size: 20px;
            transition: background 0.2s, color 0.2s;
        }
        .pw-toggle:hover, .pw-toggle:active { background: rgba(124, 58, 237, 0.1); color: var(--primary); }

        textarea.input-field { min-height: 140px; resize: vertical; line-height: 1.6; }
        textarea.mono { font-family: 'SF Mono', 'Fira Code', ui-monospace, monospace; font-size: 13px; }
        .char-count { text-align: right; font-size: 11px; color: var(--text-sub); margin-top: 6px; }

        /* ───── 버튼 ───── */
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 16px; font-weight: 700; font-family: inherit;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
            -webkit-appearance: none;
            color: #fff;
        }
        .btn:active { transform: scale(0.97); }
        .btn:focus-visible, .tab-btn:focus-visible, .pw-toggle:focus-visible {
            outline: 3px solid var(--primary-light);
            outline-offset: 2px;
        }
        .btn-primary   { background: linear-gradient(135deg, var(--primary), var(--secondary)); box-shadow: var(--shadow-btn); }
        .btn-secondary { background: linear-gradient(135deg, var(--secondary), #0ea5e9); box-shadow: 0 8px 24px rgba(79, 70, 229, 0.35); }
        .btn-success   { background: linear-gradient(135deg, var(--success), #0d9488); box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3); }
        .btn-small {
            width: auto;
            padding: 9px 14px;
            font-size: 13px;
            border-radius: 10px;
            gap: 6px;
        }
        .btn-outline {
            background: transparent;
            border: 1.5px solid var(--border);
            color: var(--text-sub);
            box-shadow: none;
        }
        .btn-outline:hover { border-color: var(--primary-light); color: var(--primary); }
        .btn:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }
        .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

        /* ───── 결과 ───── */
        .result-box {
            background: rgba(16, 185, 129, 0.08);
            border: 1.5px solid rgba(16, 185, 129, 0.35);
            border-radius: var(--radius);
            padding: 16px;
            margin-top: 16px;
        }
        .result-box.decrypt-result {
            background: rgba(79, 70, 229, 0.08);
            border-color: rgba(79, 70, 229, 0.35);
        }
        .result-header {
            display: flex; justify-content: space-between; align-items: center;
            gap: 8px; margin-bottom: 12px;
        }
        .result-label {
            display: flex; align-items: center; gap: 6px;
            font-size: 13px; font-weight: 700;
            color: var(--success);
        }
        .result-label.decrypt { color: var(--primary-light); }
        .result-text {
            font-family: 'SF Mono', 'Fira Code', ui-monospace, monospace;
            font-size: 13px;
            color: var(--text);
            word-break: break-all;
            line-height: 1.6;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 12px 14px;
            border-radius: 12px;
            max-height: 180px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            user-select: all;
        }
        .result-text.plain-text {
            font-family: inherit;
            font-size: 16px;
            white-space: pre-wrap;
        }

        /* ───── 키 강도 ───── */
        .key-strength { display: flex; gap: 5px; margin-top: 10px; }
        .strength-bar {
            height: 5px; flex: 1;
            border-radius: 3px;
            background: var(--border);
            transition: background 0.3s;
        }
        .strength-label { font-size: 11px; color: var(--text-sub); margin-top: 6px; font-weight: 600; }

        /* ───── 정보/에러 ───── */
        .info-box {
            display: flex; gap: 10px;
            background: rgba(124, 58, 237, 0.07);
            border: 1px solid rgba(124, 58, 237, 0.18);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            font-size: 12px;
            color: var(--text-sub);
            line-height: 1.7;
        }
        .info-box .ic { color: var(--primary); font-size: 18px; margin-top: 2px; }
        .info-box strong { color: var(--primary-light); }

        .error-msg {
            display: none;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            margin-bottom: 14px;
            font-size: 13px; font-weight: 600;
            color: var(--danger);
        }
        .error-msg.show { display: flex; align-items: center; gap: 8px; animation: shake 0.4s; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* ───── 토스트 ───── */
        .toast {
            position: fixed;
            bottom: calc(28px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            display: flex; align-items: center; gap: 8px;
            background: var(--text);
            color: var(--bg);
            padding: 12px 22px;
            border-radius: 30px;
            font-size: 14px; font-weight: 600;
            opacity: 0;
            transition: opacity 0.3s, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 1000;
            pointer-events: none;
            white-space: nowrap;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.success { background: var(--success); color: #fff; }
        .toast.error   { background: var(--danger);  color: #fff; }
        .toast.info    { background: var(--primary); color: #fff; }

        /* ───── 스피너 / 애니메이션 ───── */
        .spinner {
            width: 20px; height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .result-animate { animation: fadeInUp 0.4s var(--ease); }

        ::-webkit-scrollbar { display: none; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>

<!-- ───────── SVG 아이콘 스프라이트 ───────── -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
    <symbol id="i-unlock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3L21 2M16 7l3 3M14 9l2 2"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M16 6l-4-4-4 4M12 2v13"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></symbol>
    <symbol id="i-clipboard" viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></symbol>
</svg>

<!-- ───────── 헤더 ───────── -->
<header class="app-header">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <div class="header-inner">
        <div class="header-icon"><svg class="ic"><use href="#i-shield"/></svg></div>
        <h1 class="header-title">AES Cipher</h1>
        <div class="header-sub">ADVANCED · ENCRYPTION · STANDARD</div>
        <div class="header-badge"><svg class="ic"><use href="#i-lock"/></svg> AES-256-GCM</div>
    </div>
</header>

<!-- ───────── 탭 바 ───────── -->
<div class="tab-wrap">
    <div class="tab-bar" id="tab-bar" data-active="encrypt" role="tablist">
        <span class="tab-indicator"></span>
        <button class="tab-btn active" onclick="switchTab('encrypt')" id="tab-encrypt" role="tab" type="button">
            <svg class="ic"><use href="#i-lock"/></svg> 암호화
        </button>
        <button class="tab-btn" onclick="switchTab('decrypt')" id="tab-decrypt" role="tab" type="button">
            <svg class="ic"><use href="#i-unlock"/></svg> 복호화
        </button>
    </div>
</div>

<!-- ───────── 암호화 탭 ───────── -->
<main class="tab-content active" id="content-encrypt">
    <section class="card">
        <div class="card-title">
            <span class="icon-badge"><svg class="ic"><use href="#i-key"/></svg></span>
            암호화 키
            <span class="badge">AES-256</span>
        </div>
        <div class="input-group">
            <label class="input-label" for="enc-key">비밀번호 (복호화 시 동일한 키 필요)</label>
            <div class="pw-wrapper">
                <input type="password" id="enc-key" class="input-field key-field"
                       placeholder="비밀번호를 입력하세요"
                       oninput="onKeyInput(this, 'enc')"
                       autocomplete="new-password" autocorrect="off" autocapitalize="off" spellcheck="false">
                <button class="pw-toggle" onclick="togglePw('enc-key', this)" type="button" aria-label="비밀번호 표시/숨김">
                    <svg class="ic"><use href="#i-eye"/></svg>
                </button>
            </div>
            <div class="key-strength">
                <div class="strength-bar" id="sb1"></div>
                <div class="strength-bar" id="sb2"></div>
                <div class="strength-bar" id="sb3"></div>
                <div class="strength-bar" id="sb4"></div>
                <div class="strength-bar" id="sb5"></div>
            </div>
            <div class="strength-label" id="strength-label">키를 입력하면 강도가 표시됩니다</div>
        </div>
        <div class="info-box">
            <svg class="ic"><use href="#i-shield"/></svg>
            <div>
                <strong>AES-256-GCM</strong> 방식으로 암호화됩니다.<br>
                키는 <strong>PBKDF2</strong>(100,000회 반복)로 안전하게 변환되며,
                매번 <strong>랜덤 Salt + IV</strong>가 생성되어 결과가 달라집니다.
            </div>
        </div>
    </section>

    <section class="card">
        <div class="card-title">
            <span class="icon-badge"><svg class="ic"><use href="#i-file"/></svg></span>
            평문 입력
        </div>
        <div class="input-group">
            <label class="input-label" for="enc-input">한글 / 영어 / 숫자 / 특수문자 모두 지원</label>
            <textarea id="enc-input" class="input-field"
                      placeholder="암호화할 텍스트를 입력하세요..."
                      oninput="updateCharCount('enc-input', 'enc-count')"></textarea>
            <div class="char-count" id="enc-count">0자</div>
        </div>
        <div class="btn-row">
            <button class="btn btn-outline btn-small" onclick="clearEncrypt()" type="button">
                <svg class="ic"><use href="#i-trash"/></svg> 지우기
            </button>

    </section>

    <div class="error-msg" id="enc-error" role="alert">

    <button class="btn btn-primary" id="enc-btn" onclick="doEncrypt()" type="button">

    <div id="enc-result-wrap" style="display:none;">

            <div class="result-header">
                <div class="result-label"><svg class="ic"><use href="#i-check"/></svg> 암호화 완료</div>
                <div class="btn-row">
                    <button class="btn btn-success btn-small" onclick="copyText('enc-output')" type="button">
                        <svg class="ic"><use href="#i-copy"/></svg> 복사

                    <button class="btn btn-outline btn-small" onclick="shareText()" type="button">
                        <svg class="ic"><use href="#i-share"/></svg> 공유

            <div class="result-text" id="enc-output"></div>

</main>

<!-- ───────── 복호화 탭 ───────── -->
<main class="tab-content" id="content-decrypt">
    <section class="card">
        <div class="card-title">
            <span class="icon-badge"><svg class="ic"><use href="#i-key"/></svg></span>
            복호화 키
            <span class="badge">AES-256</span>
        </div>
        <div class="input-group">
            <label class="input-label" for="dec-key">암호화 시 사용한 비밀번호와 동일해야 합니다</label>
            <div class="pw-wrapper">
                <input type="password" id="dec-key" class="input-field key-field"
                       placeholder="비밀번호를 입력하세요"
                       autocomplete="current-password" autocorrect="off" autocapitalize="off" spellcheck="false">
                <button class="pw-toggle" onclick="togglePw('dec-key', this)" type="button" aria-label="비밀번호 표시/숨김">
                    <svg class="ic"><use href="#i-eye"/></svg>
                </button>

        </div>
    </section>

    <section class="card">
        <div class="card-title">
            <span class="icon-badge"><svg class="ic"><use href="#i-file"/></svg></span>
            암호문 입력
        </div>
        <div class="input-group">
            <label class="input-label" for="dec-input">복호화할 AES 암호문</label>
            <textarea id="dec-input" class="input-field mono"
                      placeholder="AES 암호화된 텍스트를 붙여넣으세요..."
                      oninput="updateCharCount('dec-input', 'dec-count')"></textarea>
            <div class="char-count" id="dec-count">0자</div>
        </div>
        <div class="btn-row">
            <button class="btn btn-outline btn-small" onclick="clearDecrypt()" type="button">
                <svg class="ic"><use href="#i-trash"/></svg> 지우기
            </button>
            <button class="btn btn-outline btn-small" onclick="pasteFromClipboard('dec-input')" type="button">
                <svg class="ic"><use href="#i-clipboard"/></svg> 붙여넣기
            </button>
            <button class="btn btn-outline btn-small" onclick="loadFromEncrypt()" type="button">
                <svg class="ic"><use href="#i-download"/></svg> 가져오기
            </button>
        </div>
    </section>

    <div class="error-msg" id="dec-error" role="alert">
        <svg class="ic"><use href="#i-alert"/></svg><span id="dec-error-text"></span>
    </div>

    <button class="btn btn-secondary" id="dec-btn" onclick="doDecrypt()" type="button">
        <svg class="ic"><use href="#i-unlock"/></svg><span>복호화하기</span>
    </button>

    <div id="dec-result-wrap" style="display:none;">
        <div class="result-box decrypt-result result-animate">
            <div class="result-header">
                <div class="result-label decrypt"><svg class="ic"><use href="#i-check"/></svg> 복호화 완료</div>
                <button class="btn btn-secondary btn-small" onclick="copyText('dec-output')" type="button">
                    <svg class="ic"><use href="#i-copy"/></svg> 복사
                </button>
            </div>
            <div class="result-text plain-text" id="dec-output"></div>
        </div>
    </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ════════════════════════════════════════════
   AES-256-GCM  ·  Web Crypto API
   키 파생: PBKDF2 (SHA-256, 100000 iterations)
   포맷: Base64( salt[16] | iv[12] | ciphertext )
════════════════════════════════════════════ */
const SALT_LEN = 16;
const IV_LEN   = 12;
const GCM_TAG_LEN = 16;

function bytesToBase64(bytes) {
    let bin = '';
    const CHUNK = 0x8000;
    for (let i = 0; i < bytes.length; i += CHUNK) {
        bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
    }
    return btoa(bin);
}

function base64ToBytes(b64) {
    return Uint8Array.from(atob(b64), c => c.charCodeAt(0));
}

const AESCipher = {
    async deriveKey(password, salt) {
        const keyMaterial = await crypto.subtle.importKey(
            'raw',
            new TextEncoder().encode(password),
            { name: 'PBKDF2' },
            false,
            ['deriveKey']
        );
        return crypto.subtle.deriveKey(
            { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
            keyMaterial,
            { name: 'AES-GCM', length: 256 },
            false,
            ['encrypt', 'decrypt']
        );
    },

    async encrypt(plainText, password) {
        const salt   = crypto.getRandomValues(new Uint8Array(SALT_LEN));
        const iv     = crypto.getRandomValues(new Uint8Array(IV_LEN));
        const key    = await this.deriveKey(password, salt);
        const cipher = await crypto.subtle.encrypt(
            { name: 'AES-GCM', iv },
            key,
            new TextEncoder().encode(plainText)
        );
        const combined = new Uint8Array(SALT_LEN + IV_LEN + cipher.byteLength);
        combined.set(salt, 0);
        combined.set(iv, SALT_LEN);
        combined.set(new Uint8Array(cipher), SALT_LEN + IV_LEN);
        return bytesToBase64(combined);
    },

    async decrypt(b64Text, password) {
        const raw = base64ToBytes(b64Text.replace(/\s+/g, ''));
        if (raw.length < SALT_LEN + IV_LEN + GCM_TAG_LEN) {
            throw new Error('Invalid ciphertext');
        }
        const salt = raw.slice(0, SALT_LEN);
        const iv   = raw.slice(SALT_LEN, SALT_LEN + IV_LEN);
        const data = raw.slice(SALT_LEN + IV_LEN);
        const key  = await this.deriveKey(password, salt);
        const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
        return new TextDecoder().decode(plain);
    }
};

/* ════════════════════════════════════════════
   UI 헬퍼
════════════════════════════════════════════ */
function switchTab(name) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
    document.getElementById('content-' + name).classList.add('active');
    document.getElementById('tab-bar').dataset.active = name;
}

function togglePw(inputId, btn) {
    const inp = document.getElementById(inputId);
    const show = inp.type === 'password';
    inp.type = show ? 'text' : 'password';
    btn.querySelector('use').setAttribute('href', show ? '#i-eye-off' : '#i-eye');
}

function onKeyInput(el, prefix) {
    if (prefix === 'enc') updateKeyStrength(el.value);
}

function updateCharCount(inputId, countId) {
    const len = [...document.getElementById(inputId).value].length;
    document.getElementById(countId).textContent = len.toLocaleString() + '자';
}

function setLoading(btn, loading, text) {
    if (loading) {
        btn.dataset.original = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<div class="spinner"></div><span>' + text + '</span>';
    } else {
        btn.disabled = false;
        if (btn.dataset.original) btn.innerHTML = btn.dataset.original;
    }
}

/* ════════════════════════════════════════════
   암호화 / 복호화
════════════════════════════════════════════ */
async function doEncrypt() {
    const text = document.getElementById('enc-input').value;
    const key  = document.getElementById('enc-key').value;
    hideError('enc');

    if (!text.trim()) { showError('enc', '암호화할 텍스트를 입력해주세요.'); return; }
    if (!key)         { showError('enc', '비밀번호(키)를 입력해주세요.');    return; }

    const btn = document.getElementById('enc-btn');
    setLoading(btn, true, 'AES 암호화 중...');
    try {
        const result = await AESCipher.encrypt(text, key);
        document.getElementById('enc-output').textContent = result;
        const wrap = document.getElementById('enc-result-wrap');
        wrap.style.display = 'block';
        wrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        showToast('암호화 완료', 'success');
    } catch (e) {
        showError('enc', '암호화 오류: ' + e.message);
    } finally {
        setLoading(btn, false);
    }
}

async function doDecrypt() {
    const cipher = document.getElementById('dec-input').value.trim();
    const key    = document.getElementById('dec-key').value;
    hideError('dec');

    if (!cipher) { showError('dec', '복호화할 암호문을 입력해주세요.'); return; }
    if (!key)    { showError('dec', '비밀번호(키)를 입력해주세요.');    return; }

    const btn = document.getElementById('dec-btn');
    setLoading(btn, true, 'AES 복호화 중...');
    try {
        const result = await AESCipher.decrypt(cipher, key);
        document.getElementById('dec-output').textContent = result;
        const wrap = document.getElementById('dec-result-wrap');
        wrap.style.display = 'block';
        wrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        showToast('복호화 완료', 'success');
    } catch {
        showError('dec', '복호화 실패: 키가 틀렸거나 잘못된 암호문입니다.');
    } finally {
        setLoading(btn, false);
    }
}

/* ════════════════════════════════════════════
   클립보드 / 공유 / 가져오기
════════════════════════════════════════════ */
async function copyText(elementId) {
    const text = document.getElementById(elementId).textContent;
    try {
        await navigator.clipboard.writeText(text);
        showToast('클립보드에 복사됨', 'info');
    } catch {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.cssText = 'position:fixed;opacity:0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('복사됨', 'info');
    }
}

async function shareText() {
    const text = document.getElementById('enc-output').textContent;
    if (navigator.share) {
        try { await navigator.share({ title: 'AES 암호문', text }); } catch {}
    } else {
        copyText('enc-output');
    }
}

async function pasteFromClipboard(inputId) {
    try {
        const text = await navigator.clipboard.readText();
        document.getElementById(inputId).value = text;
        updateCharCount(inputId, inputId === 'enc-input' ? 'enc-count' : 'dec-count');
        showToast('붙여넣기 완료', 'info');
    } catch {
        showToast('직접 붙여넣기 해주세요 (길게 탭)', 'error');
    }
}

function loadFromEncrypt() {
    const encrypted = document.getElementById('enc-output').textContent;
    const key = document.getElementById('enc-key').value;
    if (encrypted) {
        document.getElementById('dec-input').value = encrypted;
        document.getElementById('dec-key').value = key;
        updateCharCount('dec-input', 'dec-count');
        showToast('가져오기 완료', 'info');
    } else {
        showToast('먼저 암호화를 실행하세요', 'error');
    }
}

function clearEncrypt() {
    document.getElementById('enc-input').value = '';
    document.getElementById('enc-key').value = '';
    document.getElementById('enc-count').textContent = '0자';
    document.getElementById('enc-result-wrap').style.display = 'none';
    document.getElementById('enc-output').textContent = '';
    hideError('enc');
    resetKeyStrength();
}

function clearDecrypt() {
    document.getElementById('dec-input').value = '';
    document.getElementById('dec-key').value = '';
    document.getElementById('dec-count').textContent = '0자';
    document.getElementById('dec-result-wrap').style.display = 'none';
    document.getElementById('dec-output').textContent = '';
    hideError('dec');
}

/* ════════════════════════════════════════════
   에러 / 토스트 / 키 강도
════════════════════════════════════════════ */
function showError(prefix, msg) {
    const el = document.getElementById(prefix + '-error');
    document.getElementById(prefix + '-error-text').textContent = msg;
    el.classList.remove('show');
    void el.offsetWidth; // 애니메이션 재시작
    el.classList.add('show');
    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function hideError(prefix) {
    document.getElementById(prefix + '-error').classList.remove('show');
}

function showToast(msg, type = 'info') {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.className = 'toast ' + type;
    void toast.offsetWidth;
    toast.classList.add('show');
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
}

const STRENGTH_COLORS = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#10b981'];
const STRENGTH_LABELS = ['매우 약함', '약함', '보통', '강함', '매우 강함'];
const STRENGTH_IDS    = ['sb1', 'sb2', 'sb3', 'sb4', 'sb5'];

function updateKeyStrength(value) {
    const len = value.length;
    const variety = [/[A-Z]/, /[a-z]/, /[0-9]/, /[^A-Za-z0-9]/]
        .filter(re => re.test(value)).length;

    let strength = 0;
    if (len >= 1)  strength = 1;
    if (len >= 6)  strength = 2;
    if (len >= 8  && variety >= 2) strength = 3;
    if (len >= 10 && variety >= 3) strength = 4;
    if (len >= 12 && variety >= 4) strength = 5;

    STRENGTH_IDS.forEach((id, i) => {
        document.getElementById(id).style.background =
            i < strength ? STRENGTH_COLORS[strength - 1] : 'var(--border)';
    });

    const label = document.getElementById('strength-label');
    if (len === 0) {
        resetKeyStrength();
    } else {
        label.textContent = '키 강도: ' + STRENGTH_LABELS[strength - 1];
        label.style.color = STRENGTH_COLORS[strength - 1];
    }
}

function resetKeyStrength() {
    STRENGTH_IDS.forEach(id => {
        document.getElementById(id).style.background = 'var(--border)';
    });
    const label = document.getElementById('strength-label');
    label.textContent = '키를 입력하면 강도가 표시됩니다';
    label.style.color = '';
}

/* ════════════════════════════════════════════
   키보드 / 포커스
════════════════════════════════════════════ */
document.getElementById('enc-key').addEventListener('keydown', e => {
    if (e.key === 'Enter') doEncrypt();
});
document.getElementById('dec-key').addEventListener('keydown', e => {
    if (e.key === 'Enter') doDecrypt();
});
document.querySelectorAll('input, textarea').forEach(el => {
    el.addEventListener('focus', () => {
        setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'center' }), 350);
    });
});
</script>
</body>
